name: Chibi merge policy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Chibi review signal]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write
  statuses: write
  issues: write
  pull-requests: write

jobs:
  policy:
    uses: waldnercharles/chibi-studio/.github/workflows/chibi-merge-policy-reusable.yml@a8e18c7574071f76d7cb4bdcb89271967e40fc6f
    with:
      gate_ready: ${{ vars.CHIBI_REVIEW_GATE_READY == 'true' }}
      post_merge_workflows: >-
        [{"workflow":"web.yml","include":["content/**","project.kdl",".github/workflows/web.yml"]}]
    permissions:
      contents: write
      actions: write
      statuses: write
      issues: write
      pull-requests: write
